<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แท็กซี่เชียงราย บริการ 24 ชม. รับ-ส่งสนามบิน ทัวร์เชียงราย ราคาถูก</title>
    <style>
        * { box-sizing: border-box; font-family: sans-serif; }
        body { margin: 0; padding: 20px; background-color: #f7f9fa; line-height: 1.6; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; }
        h1, h2 { color: #2c3e50; text-align: center; }
        .contact-box { background: #eef2f5; padding: 15px; border-radius: 4px; text-align: center; }
        .btn-group { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 10px; }
        .btn { padding: 10px 15px; text-decoration: none; border-radius: 5px; color: white; font-weight: bold; }
        .btn-tel { background: #27ae60; }
        .btn-line { background: #06c755; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
        .price-tag { font-weight: bold; color: #e74c3c; }
    </style>
</head>
<body>
    <div class="container">
        <h1>แท็กซี่เชียงราย บริการ 24 ชม.</h1>
        
        <div class="contact-box">
            <h3>ติดต่อสอบถามและจองรถ</h3>
            <div class="btn-group">
                <a href="tel:0933813157" class="btn btn-tel">📞 โทร: 093-381-3157</a>
                <a href="https://line.me" class="btn btn-line">💬 LINE: taxioneplus</a>
            </div>
        </div>

        <h2>อัตราค่าบริการเริ่มต้น</h2>
        <table>
            <tr><th>เส้นทาง (จากสนามบิน)</th><th>ราคา</th></tr>
            <tr><td>ตัวเมืองเชียงราย</td><td class="price-tag">200-300.-</td></tr>
            <tr><td>แม่สาย/เชียงแสน</td><td class="price-tag">700.-</td></tr>
            <tr><td>ดอยแม่สลอง/ดอยช้าง</td><td class="price-tag">1,200.-</td></tr>
            <tr><td>ภูชี้ฟ้า</td><td class="price-tag">1,700.-</td></tr>
        </table>
    </div>
</body>
</html>
